<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <style>
      .wall-ours { fill:none; stroke:#222; stroke-width:3.5; }
      .room { fill:#FFF; stroke:#999; stroke-width:1; }
      .room-office { fill:#F2F6FB; stroke:#9BB4D1; stroke-width:1; }
      .room-meeting { fill:#FFF8E1; stroke:#D4A017; stroke-width:1; }
      .room-exec { fill:#F3E5F5; stroke:#7B1FA2; stroke-width:1.2; }
      .room-lounge { fill:#E8F5E9; stroke:#388E3C; stroke-width:1; }
      .core { fill:#ECECEC; stroke:#888; stroke-width:1; }
      .stair { fill:#DCEEDC; stroke:#3A7E3A; stroke-width:1.8; }
      .cargo-ev { fill:#FFEDD5; stroke:#C2410C; stroke-width:1.5; }
      .storage { fill:#F5F0E8; stroke:#8B6F47; stroke-width:1; stroke-dasharray:3 2; }
      .door { fill:#FFD700; stroke:#B8860B; stroke-width:2; }
      .label-ko { font-size:13px; fill:#222; text-anchor:middle; font-weight:600; }
      .label-en { font-size:10px; fill:#666; text-anchor:middle; }
      .label-sm-ko { font-size:11px; fill:#333; text-anchor:middle; font-weight:500; }
      .label-sm-en { font-size:9px; fill:#777; text-anchor:middle; }
      .seat-ko { font-size:10px; fill:#222; text-anchor:middle; font-weight:600; }
      .seat-en { font-size:8px; fill:#666; text-anchor:middle; }
      .stair-ko { font-size:11px; fill:#1F5E1F; text-anchor:middle; font-weight:700; }
      .exec-ko { font-size:11px; fill:#4A148C; text-anchor:middle; font-weight:700; }
      .door-label { font-size:10px; fill:#8B4513; text-anchor:middle; font-weight:700; }
      .title { font-size:22px; font-weight:700; fill:#111; }
      .subtitle { font-size:12px; fill:#555; }
      .legend { font-size:12px; fill:#222; }
      .red-tag { font-size:9px; fill:#E60012; text-anchor:middle; font-weight:700; }
    </style>

    <symbol id="exitSign" viewBox="0 0 40 30">
      <rect width="40" height="30" rx="3" fill="#00964F"/>
      <circle cx="13" cy="9" r="2.2" fill="#fff"/>
      <path d="M9 26 L13 17 L18 19 L22 14 L17 11 L11 13 L8 18 Z" fill="#fff"/>
      <rect x="26" y="8" width="9" height="16" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path d="M22 18 L34 18 L31 15 M34 18 L31 21" stroke="#fff" stroke-width="1.8" fill="none"/>
    </symbol>

    <symbol id="extinguisher" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="2" fill="#BF1E2D"/>
      <rect x="9" y="6" width="6" height="13" fill="#fff" rx="1"/>
      <rect x="10" y="3" width="4" height="3" fill="#fff"/>
    </symbol>

    <symbol id="hydrant" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="2" fill="#BF1E2D"/>
      <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">소</text>
    </symbol>
  </defs>

  <rect width="1200" height="900" fill="#FAFAFA"/>

  <text x="40" y="40" class="title">29F · 비상대피 안내도</text>
  <text x="40" y="58" class="subtitle">29F Emergency Evacuation Map · SANDBOX 용산 헤링턴스퀘어 센트럴파크타워 (전층 사용)</text>

  <g transform="translate(1130,75)">
    <circle r="22" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <path d="M0 -16 L6 8 L0 4 L-6 8 Z" fill="#333"/>
    <text y="-26" text-anchor="middle" font-size="13" font-weight="700">N</text>
  </g>

  <!-- 우리 영역 외곽 (전층) -->
  <path class="wall-ours" d="M 80 100 L 1120 100 L 1120 800 L 80 800 Z"/>
  <text x="100" y="120" font-size="11" fill="#1F5E1F" font-weight="700">SANDBOX 29F (전층)</text>

