  <text x="585" y="665" class="label-sm-ko">공조실</text>
  <text x="585" y="679" class="label-sm-en">(HVAC)</text>

  <!-- 창고 29F-B (AD Solutions) -->
  <rect class="storage" x="545" y="715" width="135" height="75"/>
  <text x="612" y="748" class="label-sm-ko">창고 29F-B</text>
  <text x="612" y="762" class="label-sm-en">(Storage B · AD Solutions)</text>

  <!-- 비상계단 B (우측 코어) -->
  <rect class="stair" x="630" y="630" width="60" height="80"/>
  <text x="660" y="675" class="stair-ko">비상계단 B</text>
  <text x="660" y="689" class="stair-ko" font-size="10">Stairs B</text>

  <!-- CU택배 발송 / 시딩 보관 랙 -->
  <rect class="room" x="695" y="630" width="120" height="80"/>
  <text x="755" y="660" class="label-sm-ko">CU택배 발송</text>
  <text x="755" y="674" class="label-sm-en">(CU Shipping)</text>
  <text x="755" y="690" class="label-sm-ko">시딩 보관 랙</text>

  <!-- OA복합기 ② -->
  <rect class="room" x="695" y="715" width="120" height="75"/>
  <text x="755" y="748" class="label-sm-ko">OA복합기 ②</text>
  <text x="755" y="762" class="label-sm-en">(Copier 10.30.29.3)</text>

  <!-- 창고 (미화) -->
  <rect class="storage" x="820" y="630" width="100" height="80"/>
  <text x="870" y="668" class="label-sm-ko">창고 (미화)</text>
  <text x="870" y="682" class="label-sm-en">(Janitorial)</text>

  <!-- PS · 소품실 -->
  <rect class="room" x="820" y="715" width="100" height="75"/>
  <text x="870" y="748" class="label-sm-ko">PS</text>
  <text x="870" y="762" class="label-sm-en">(Props · Storage)</text>

  <!-- 여자화장실 -->
  <rect class="core" x="930" y="630" width="90" height="80"/>
  <text x="975" y="668" class="label-sm-ko">여자화장실</text>
  <text x="975" y="682" class="label-sm-en">(Women)</text>

  <!-- 남자화장실 -->
  <rect class="core" x="930" y="715" width="90" height="75"/>
  <text x="975" y="748" class="label-sm-ko">남자화장실</text>
  <text x="975" y="762" class="label-sm-en">(Men)</text>

  <!-- 정문 ② (우측 코어, 비상계단 B 옆 — 전층 사용 시 후문/보조) -->
  <rect class="door" x="1025" y="660" width="80" height="20" rx="2"/>
  <text x="1065" y="675" class="door-label">정문 ② · Entry ②</text>
  <text x="1065" y="700" class="label-sm-en">(보조 / Secondary)</text>

  <!-- 우측 외벽 (코어) -->
  <rect class="core" x="1030" y="710" width="80" height="80"/>
  <text x="1070" y="748" class="label-sm-ko">코어/EV</text>
  <text x="1070" y="762" class="label-sm-en">(Core)</text>

  <!-- ============ 비상구 픽토그램 ============ -->
  <use href="#exitSign" x="688" y="468" width="36" height="27"/>
  <use href="#exitSign" x="635" y="638" width="36" height="27"/>

  <!-- ============ 소방시설 ============ -->
  <use href="#extinguisher" x="100" y="442" width="18" height="18"/>
  <use href="#extinguisher" x="640" y="392" width="18" height="18"/>
  <use href="#extinguisher" x="950" y="442" width="18" height="18"/>
  <use href="#extinguisher" x="430" y="730" width="18" height="18"/>
  <use href="#hydrant" x="678" y="615" width="20" height="20"/>
  <use href="#hydrant" x="678" y="710" width="20" height="20"/>

  <!-- 안내 메시지 -->
  <g transform="translate(40,810)">
    <rect width="700" height="80" fill="#fff" stroke="#CCC" rx="4"/>
    <text x="14" y="22" class="legend" font-weight="700">범례 · Legend</text>

    <use href="#exitSign" x="14" y="32" width="22" height="16"/>
    <text x="42" y="44" class="legend">비상구 (Exit)</text>

    <rect class="stair" x="140" y="34" width="14" height="14"/>
    <text x="160" y="44" class="legend">비상계단 (Stairs)</text>

    <rect class="cargo-ev" x="290" y="34" width="14" height="14"/>
    <text x="310" y="44" class="legend">화물 EV (Cargo)</text>

    <rect class="door" x="430" y="34" width="14" height="14"/>
    <text x="450" y="44" class="legend">정문 (Main Entry)</text>

    <rect class="room-exec" x="570" y="34" width="14" height="14"/>
    <text x="590" y="44" class="legend">임원실 (Executive)</text>

    <rect class="room-meeting" x="14" y="58" width="14" height="14"/>
    <text x="34" y="68" class="legend">미팅룸 (Meeting)</text>

    <rect class="room-lounge" x="140" y="58" width="14" height="14"/>
    <text x="160" y="68" class="legend">라운지 (Lounge)</text>

    <rect class="storage" x="290" y="58" width="14" height="14"/>
    <text x="310" y="68" class="legend">창고 (Storage)</text>

    <use href="#extinguisher" x="430" y="58" width="14" height="14"/>
