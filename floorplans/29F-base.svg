  <text x="260" y="190" class="label-ko">좌측 사무 좌석군</text>
  <text x="260" y="204" class="label-en">(West Office Seating)</text>
  <text x="260" y="226" class="label-sm-ko">CXO · IP · Partnership</text>

  <!-- CGO Office (이필성) -->
  <rect class="room-exec" x="440" y="130" width="170" height="140"/>
  <text x="525" y="190" class="exec-ko">CGO Office</text>
  <text x="525" y="206" class="seat-en">(이필성 / Lee Pil-sung)</text>

  <!-- 중앙 좌석군 (Partnership · AD Business) -->
  <rect class="room-office" x="620" y="130" width="280" height="140"/>
  <text x="760" y="190" class="label-ko">중앙 사무 좌석군</text>
  <text x="760" y="204" class="label-en">(Center Office Seating)</text>
  <text x="760" y="226" class="label-sm-ko">Partnership · AD Business</text>

  <!-- 우측 좌석군 (HR · Legal · Design) -->
  <rect class="room-office" x="910" y="130" width="200" height="140"/>
  <text x="1010" y="190" class="label-ko">우측 사무 좌석군</text>
  <text x="1010" y="204" class="label-en">(East Office Seating)</text>
  <text x="1010" y="226" class="label-sm-ko">HR · Legal · Design</text>

  <!-- ============ 중앙 행 (y=280~450) ============ -->
  <!-- IP·FP 좌석군 -->
  <rect class="room-office" x="90" y="280" width="200" height="170"/>
  <text x="190" y="345" class="label-ko">IP · FP · BDP</text>
  <text x="190" y="359" class="label-en">좌석군 (Seating)</text>

  <!-- 미팅룸 2 -->
  <rect class="room-meeting" x="295" y="280" width="135" height="80"/>
  <text x="362" y="316" class="label-sm-ko">미팅룸 2</text>
  <text x="362" y="330" class="label-sm-en">(Meeting Room 2)</text>

  <!-- 미팅룸 3 -->
  <rect class="room-meeting" x="295" y="365" width="135" height="85"/>
  <text x="362" y="403" class="label-sm-ko">미팅룸 3</text>
  <text x="362" y="417" class="label-sm-en">(Meeting Room 3)</text>

  <!-- EPS/TPS -->
