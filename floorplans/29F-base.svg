  <text x="170" y="665" class="label-sm-ko">미팅룸 5</text>
  <text x="170" y="679" class="label-sm-en">(Meeting Room 5)</text>

  <rect class="room-office" x="90" y="715" width="160" height="75"/>
  <text x="170" y="748" class="label-sm-ko">AD 좌석군 (남측)</text>
  <text x="170" y="762" class="label-sm-en">(AD South)</text>

