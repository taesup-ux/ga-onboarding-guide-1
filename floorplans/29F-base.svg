  <text x="525" y="325" class="label-ko">EPS / TPS</text>
  <text x="525" y="339" class="label-en">(전력실 · 통신실)</text>

  <!-- 인감날인석 + OA복합기 ① -->
  <rect class="room" x="440" y="385" width="170" height="65"/>
  <text x="525" y="408" class="label-sm-ko">인감날인석 · OA복합기 ①</text>
  <text x="525" y="422" class="label-sm-en">(Seal · Copier 10.30.29.2)</text>

