    <rect width="400" height="80" fill="#BF1E2D" rx="4"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#fff">화재신고 119 · Fire 119</text>
    <text x="20" y="46" font-size="11" fill="#fff">관리실 (Building Mgmt)</text>
    <text x="20" y="64" font-size="11" fill="#fff">GA Slack #ga-helpdesk</text>
