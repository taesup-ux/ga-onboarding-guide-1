<!-- ============ 비상대피 동선 (A루트 초록 + B루트 파랑) ============ -->
<!-- A루트: 룸간 벽 회피 — R1/2 우측 + R3/4 좌측 → Gap A(x=345) 합류 / R5/6 우측 + R7/8 좌측 → Gap B(x=683) 합류 → 내부 복도 → 메인도어 ① → 공용 복도 → 비상계단 A 고층/저층 -->
<path class="rt r-a" d="
  M 275 130 H 345
  M 275 235 H 345
  M 412 156 H 345
  M 412 254 H 345
  M 345 130 V 365
  M 637 156 H 683
  M 637 254 H 683
  M 787 220 H 683
  M 787 320 H 683
  M 683 156 V 365
  M 683 365 H 330
  M 330 365 V 475
  M 330 475 H 958
  M 513 475 V 745
  M 513 745 H 390
  M 958 475 V 745
  M 958 745 H 835
"/>
<!-- B루트: Conference Room → 메인도어 ② (x=965) → 공용 복도 → 비상계단 B (외부 우측) -->
<path class="rt r-b" d="
  M 965 305 V 475
  M 965 475 H 1255
  M 1255 475 V 555
"/>

<!-- ============ 출발점 마커 — 모든 회의실 (텍스트 좌/우 분기) ============ -->
<!-- ROOM 1: 텍스트 우측 -->
<g transform="translate(275,130)"><circle class="start-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/><circle class="start-dot" cx="0" cy="0" r="7" fill="#E60012"/><circle cx="0" cy="0" r="2.5" fill="#fff"/></g>
<!-- ROOM 2: 텍스트 우측 -->
