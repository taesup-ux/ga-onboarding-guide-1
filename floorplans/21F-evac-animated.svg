     · width 825 → 800 — ROOM 7/8 우측 통로 제거 후 외곽선 우측이 ROOM 7/8 박스(x_right=875)와 정렬 ============ -->
<rect fill="#c8c8c8" stroke="#DB2777" stroke-width="4" x="75" y="95" width="800" height="320"/>

