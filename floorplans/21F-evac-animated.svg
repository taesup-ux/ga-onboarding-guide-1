<!-- ============ 메인 EV존 · 고층부 (폭 620 → 440 축소, 좌측 컬럼 + 메인통로 + 우측 컬럼 동일 구조) ============ -->
<rect class="ev-zone" x="280" y="515" width="440" height="285"/>
<text x="290" y="508" class="tk" style="fill:#3F51B5;font-size:11px;font-weight:800;text-anchor:start;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round">EV ZONE (메인엘베존 · 고층부)</text>

