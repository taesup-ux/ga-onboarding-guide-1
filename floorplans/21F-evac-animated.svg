<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1500 870" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  text{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}
  .bg{fill:#f0f0f0}
  .wall{fill:none;stroke:#111;stroke-width:3}
  .corr{fill:#c8c8c8}
  .open{fill:#EFF5FF;stroke:#9BB4D1;stroke-width:1}
  .mtg{fill:#FFF8E1;stroke:#D4A017;stroke-width:1}
  .exec{fill:#FCE4EC;stroke:#DB2777;stroke-width:4}
  .core{fill:#ECECEC;stroke:#888;stroke-width:1}
  .stair{fill:#DCEEDC;stroke:#3A7E3A;stroke-width:2}
  .stor{fill:#F5F0E8;stroke:#8B6F47;stroke-width:1;stroke-dasharray:3 2}
  .util{fill:#fff;stroke:#999;stroke-width:1}
  .srvr{fill:#E8E8E8;stroke:#555;stroke-width:1.5}
  .ev-zone{fill:#E8EAF6;stroke:#5C6BC0;stroke-width:2}
  .cargo-ev{fill:#FFEDD5;stroke:#C2410C;stroke-width:1.5}
  .corridor-int{fill:#F5F5F5;stroke:#AAA;stroke-width:1.2;stroke-dasharray:3 3}
  .recycle{fill:#E8F5E9;stroke:#558B2F;stroke-width:1.2}
  .door-mark{fill:#FFD700;stroke:#B8860B;stroke-width:2.2}
  .ev-label{font-size:11px;fill:#3F51B5;text-anchor:middle;font-weight:700}
  .stair-ko{font-size:12px;fill:#1F5E1F;text-anchor:middle;font-weight:700}
  .red-tag{font-size:10px;fill:#E60012;text-anchor:middle;font-weight:700}
  .label-sm-ko{font-size:11px;fill:#333;text-anchor:middle;font-weight:500}

  .tk{font-size:13px;fill:#222;text-anchor:middle;font-weight:600}
  .ts{font-size:11px;fill:#333;text-anchor:middle;font-weight:500;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
  .tx{font-size:10px;fill:#666;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2px;stroke-linejoin:round}
  .tc{font-size:14px;fill:#444;text-anchor:middle;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .tit{font-size:22px;font-weight:700;fill:#111}
  .tdoor{font-size:10px;fill:#0277BD;text-anchor:middle;font-weight:700}

  /* 점멸 (비상구·소화전) — 28F/29F와 동일 사양 */
  .exit-pulse{animation:pls 1.4s ease-in-out infinite}
  .hydrant-glow{animation:pls 1.4s ease-in-out infinite}
  @keyframes pls{0%,100%{opacity:1}50%{opacity:.65}}
  /* 출발점 마커 — 28F/29F와 동일 (확장 링 + 펄스 점) */
  .start-ring{animation:rn 1.5s ease-out infinite}
  @keyframes rn{0%{r:8;opacity:1}100%{r:22;opacity:0}}
  .start-dot{animation:pls 1.4s ease-in-out infinite}
  /* 비상대피 동선 — 28F/29F 사양 (점선 12 7, dashoffset 애니메이션) */
  .rt{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 7}
  .r-a{stroke:#00964F;stroke-width:5;animation:f 2.0s linear infinite}
  .r-b{stroke:#0288D1;stroke-width:5;animation:f 2.2s linear infinite}
  @keyframes f{from{stroke-dashoffset:0}to{stroke-dashoffset:-38}}
</style>
<symbol id="es" viewBox="0 0 40 30"><rect width="40" height="30" rx="3" fill="#00964F"/><circle cx="13" cy="9" r="2.2" fill="#fff"/><path d="M9 26L13 17L18 19L22 14L17 11L11 13L8 18Z" fill="#fff"/><rect x="26" y="8" width="9" height="16" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M22 18L34 18L31 15M34 18L31 21" stroke="#fff" stroke-width="1.8" fill="none"/></symbol>
<symbol id="hydrant" viewBox="0 0 24 24"><rect width="24" height="24" rx="2" fill="#BF1E2D"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">소</text></symbol>
</defs>

<rect class="bg" width="1500" height="870"/>
