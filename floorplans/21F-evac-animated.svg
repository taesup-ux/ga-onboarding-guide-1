<text x="38" y="63" style="font-size:12px;fill:#555">SANDBOX 코너스페이스 용산역점 · 호실 1 (ROOM 1~8) + 호실 2 (Conference Room) + 화장실 가로 면 + 비상계단</text>

<!-- 코너스페이스 공용복도 (외곽 전체 - 좌·상·우 회색 띠) -->
<rect fill="#D6D6D6" stroke="none" x="55" y="80" width="1440" height="730"/>

<!-- 외곽 wall (코너스페이스 건물 경계) -->
<path class="wall" d="M55 80 L1495 80 L1495 810 L55 810 Z"/>


<!-- ============ SANDBOX 호실 1 (ROOM 1~8) 점유 구역 경계 (분홍선)
