<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  text{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}
  .bg{fill:#f0f0f0}
  .wall{fill:none;stroke:#111;stroke-width:3}
  .corr{fill:#c8c8c8}
  .room{fill:#FFF8E1;stroke:#D4A017;stroke-width:1}
  .conf{fill:#FCE4EC;stroke:#C2185B;stroke-width:2}
  .sandbox{fill:#FCE7F3;stroke:#DB2777;stroke-width:1.5}
  .core{fill:#ECECEC;stroke:#888;stroke-width:1}
  .stair{fill:#DCEEDC;stroke:#3A7E3A;stroke-width:2}
  .ev{fill:#E8E8E8;stroke:#555;stroke-width:1}
  .stor{fill:#F5F0E8;stroke:#8B6F47;stroke-width:1;stroke-dasharray:3 2}
  .util{fill:#fff;stroke:#999;stroke-width:1}
  .other{fill:#EFF5FF;stroke:#9BB4D1;stroke-width:1;stroke-dasharray:6 4}
  .door{fill:none;stroke:#0288D1;stroke-width:2.5;stroke-dasharray:8 4}
  .pillar{fill:#222}

  .tk{font-size:13px;fill:#222;text-anchor:middle;font-weight:650}
  .te{font-size:10px;fill:#666;text-anchor:middle}
  .ts{font-size:11px;fill:#333;text-anchor:middle;font-weight:550}
  .tx{font-size:9px;fill:#888;text-anchor:middle}
  .tst{font-size:12px;fill:#1a5e20;text-anchor:middle;font-weight:800}
  .tc{font-size:11px;fill:#444;text-anchor:middle;font-weight:700}
  .tit{font-size:22px;font-weight:800;fill:#111}
  .tdoor{font-size:10px;fill:#0277BD;text-anchor:middle;font-weight:700}

  .rt{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 8}
  .r1{stroke:#00964F;filter:drop-shadow(0 0 3px rgba(0,150,79,.5));animation:f 2.0s linear infinite}
  .r2{stroke:#0288D1;filter:drop-shadow(0 0 3px rgba(2,136,209,.5));animation:f 2.2s linear infinite}
  .r3{stroke:#FF6F00;filter:drop-shadow(0 0 3px rgba(255,111,0,.5));animation:f 2.4s linear infinite}
  .r4{stroke:#7B1FA2;filter:drop-shadow(0 0 3px rgba(123,31,162,.5));animation:f 2.6s linear infinite}
  .r5{stroke:#C62828;filter:drop-shadow(0 0 3px rgba(198,40,40,.5));animation:f 2.8s linear infinite}
  .r6{stroke:#5D4037;filter:drop-shadow(0 0 3px rgba(93,64,55,.5));animation:f 3.0s linear infinite}
  .r7{stroke:#F57F17;filter:drop-shadow(0 0 3px rgba(245,127,23,.5));animation:f 3.2s linear infinite}
  .r8{stroke:#1565C0;filter:drop-shadow(0 0 3px rgba(21,101,192,.5));animation:f 3.4s linear infinite}
  .r9{stroke:#AD1457;filter:drop-shadow(0 0 3px rgba(173,20,87,.5));animation:f 3.6s linear infinite}
  @keyframes f{from{stroke-dashoffset:0}to{stroke-dashoffset:-42}}

  .yr{animation:rn 1.6s ease-out infinite}
  @keyframes rn{0%{r:12;opacity:1}100%{r:34;opacity:0}}
  .yp{animation:pls 1.6s ease-in-out infinite}
  @keyframes pls{0%,100%{opacity:1}50%{opacity:.65}}
  .bp{animation:bpa 1.3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes bpa{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
<symbol id="ext" viewBox="0 0 24 24"><rect width="24" height="24" rx="2" fill="#BF1E2D"/><rect x="9" y="6" width="6" height="13" fill="#fff" rx="1"/><rect x="10" y="3" width="4" height="3" fill="#fff"/></symbol>
<symbol id="es" viewBox="0 0 40 30"><rect width="40" height="30" rx="3" fill="#00964F"/><circle cx="13" cy="9" r="2.2" fill="#fff"/><path d="M9 26L13 17L18 19L22 14L17 11L11 13L8 18Z" fill="#fff"/><rect x="26" y="8" width="9" height="16" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M22 18L34 18L31 15M34 18L31 21" stroke="#fff" stroke-width="1.8" fill="none"/></symbol>
