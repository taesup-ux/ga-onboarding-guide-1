<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <style>
      .wall-ours { fill:none; stroke:#222; stroke-width:3.5; }
      .corridor-internal { fill:#F5F5F5; stroke:#AAA; stroke-width:1.2; stroke-dasharray:3 3; }
      .other-tenant { fill:#D8D8D8; stroke:#999; stroke-width:1.2; stroke-dasharray:4 3; }
      .corridor { fill:#D6D6D6; stroke:#888; stroke-width:1.5; }
      .room-prod { fill:#FAF6EC; stroke:#C9B884; stroke-width:1.2; }
      .room-office { fill:#F2F6FB; stroke:#9BB4D1; stroke-width:1.2; }
      .room-util { fill:#FFF; stroke:#999; stroke-width:1; }
      .ev-zone { fill:#E8EAF6; stroke:#5C6BC0; stroke-width:2; }
      .core { fill:#ECECEC; stroke:#888; stroke-width:1; }
      .stair { fill:#DCEEDC; stroke:#3A7E3A; stroke-width:1.8; }
      .cargo-ev { fill:#FFEDD5; stroke:#C2410C; stroke-width:1.5; }
      .recycle { fill:#E8F5E9; stroke:#558B2F; stroke-width:1.2; }
      .door { fill:#FFD700; stroke:#B8860B; stroke-width:2.2; }
      .label-ko { font-size:13px; fill:#222; text-anchor:middle; font-weight:600; }
      .label-en { font-size:10px; fill:#666; text-anchor:middle; }
      .label-sm-ko { font-size:11px; fill:#333; text-anchor:middle; font-weight:500; }
      .label-sm-en { font-size:9px; fill:#777; text-anchor:middle; }
      .stair-ko { font-size:12px; fill:#1F5E1F; text-anchor:middle; font-weight:700; }
      .other-label { font-size:11px; fill:#888; text-anchor:middle; font-style:italic; }
      .corridor-ko { font-size:14px; fill:#444; text-anchor:middle; font-weight:700; }
      .corridor-en { font-size:11px; fill:#666; text-anchor:middle; }
      .ev-label { font-size:11px; fill:#3F51B5; text-anchor:middle; font-weight:700; }
      .red-tag { font-size:10px; fill:#E60012; text-anchor:middle; font-weight:700; }
      .title { font-size:22px; font-weight:700; fill:#111; }
      .subtitle { font-size:12px; fill:#555; }

      /* A 루트: 초록 — 정문 → EV ZONE → 비상계단 A */
      .route-a {
        fill: none;
        stroke: #00964F;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 14 10;
        filter: drop-shadow(0 0 5px rgba(0, 150, 79, 0.6));
        animation: flow-a 2s linear infinite;
      }
      @keyframes flow-a {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -48; }
      }

      /* B 루트: 청록 — 쪽문 → 외부 → 비상계단 B */
      .route-b {
        fill: none;
        stroke: #0288D1;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 12 8;
        filter: drop-shadow(0 0 4px rgba(2, 136, 209, 0.6));
        animation: flow-b 2.4s linear infinite;
      }
      @keyframes flow-b {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -40; }
      }

      .exit-pulse {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }

      .yah-ring {
        animation: ring 1.6s ease-out infinite;
      }
      @keyframes ring {
        0% { r: 8; opacity: 1; }
        100% { r: 28; opacity: 0; }
      }

      .yah-dot {
        animation: dotpulse 1.6s ease-in-out infinite;
      }
      @keyframes dotpulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>

    <symbol id="hydrant" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="2" fill="#BF1E2D"/>
      <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">소</text>
    </symbol>

    <symbol id="exitSign" viewBox="0 0 40 30">
      <rect width="40" height="30" rx="3" fill="#00964F"/>
      <circle cx="13" cy="9" r="2.2" fill="#fff"/>
      <path d="M9 26 L13 17 L18 19 L22 14 L17 11 L11 13 L8 18 Z" fill="#fff"/>
      <rect x="26" y="8" width="9" height="16" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path d="M22 18 L34 18 L31 15 M34 18 L31 21" stroke="#fff" stroke-width="1.8" fill="none"/>
    </symbol>
  </defs>

  <rect width="1200" height="1050" fill="#FAFAFA"/>

  <text x="40" y="40" class="title">28F · 비상대피 동선</text>
  <text x="40" y="58" class="subtitle">28F Evacuation Routes · SANDBOX 용산 헤링턴스퀘어 센트럴파크타워 (반층)</text>

  <g transform="translate(1140,75)">
    <circle r="22" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <path d="M0 -16 L6 8 L0 4 L-6 8 Z" fill="#333"/>
    <text y="-26" text-anchor="middle" font-size="13" font-weight="700">N</text>
  </g>

  <!-- 우리 영역 외곽 -->
  <path class="wall-ours" d="M 80 100 L 1120 100 L 1120 720 L 80 720 Z"/>
  <text x="100" y="120" font-size="11" fill="#1F5E1F" font-weight="700">SANDBOX 28F (반층)</text>

  <!-- 상단 -->
  <rect class="room-prod" x="90" y="130" width="160" height="150"/>
  <text x="170" y="200" class="label-ko">스튜디오 2</text>
  <text x="170" y="216" class="label-en">(Studio 2)</text>

  <rect class="room-prod" x="255" y="130" width="170" height="170"/>
  <text x="340" y="205" class="label-ko">부조정실</text>
  <text x="340" y="221" class="label-en">(Sub Control)</text>

  <rect class="room-office" x="430" y="130" width="480" height="170"/>
  <text x="670" y="210" class="label-ko">사무 좌석</text>
  <text x="670" y="226" class="label-en">(Office Seating)</text>

  <rect class="room-prod" x="915" y="130" width="195" height="170"/>
  <text x="1012" y="210" class="label-ko">메일룸</text>
  <text x="1012" y="226" class="label-en">(Mail Room)</text>

  <!-- 중간 -->
  <rect class="room-util" x="90" y="285" width="160" height="145"/>
  <text x="170" y="350" class="label-sm-ko">스토리지</text>

  <rect class="corridor-internal" x="255" y="305" width="375" height="125"/>
  <text x="442" y="358" class="corridor-ko">내부 통로</text>
  <text x="442" y="374" class="corridor-en">(Internal Corridor)</text>
  <text x="442" y="396" class="label-sm-ko">(EPS / TPS · 전력·통신실)</text>

  <!-- 사무 좌석 좌측 세로 통로 (쪽문 → 화장실 전용) -->
  <rect class="corridor-internal" x="640" y="305" width="50" height="415"/>
  <text x="665" y="510" font-size="11" fill="#8B4513" font-weight="700" text-anchor="middle" transform="rotate(-90 665 510)">쪽문 → 화장실 통로</text>

  <!-- 사무 좌석 -->
  <rect class="room-office" x="695" y="305" width="415" height="415"/>
  <text x="900" y="505" class="label-ko">사무 좌석</text>
  <text x="900" y="522" class="label-en">(Office Seating)</text>

  <!-- Studio 1 -->
  <rect class="room-prod" x="90" y="435" width="160" height="85"/>
  <text x="170" y="475" class="label-ko">스튜디오 1</text>
  <text x="170" y="491" class="label-en">(Studio 1)</text>

  <!-- 타사 영역 -->
  <rect class="other-tenant" x="90" y="525" width="270" height="195"/>
  <text x="170" y="670" class="other-label" font-size="13">타사 (Other Tenant)</text>

  <!-- EV ZONE -->
  <rect class="ev-zone" x="255" y="440" width="365" height="280"/>
  <text x="437" y="458" class="label-ko" fill="#3F51B5">EV ZONE (메인 엘베존)</text>

  <!-- 비상계단 A -->
  <rect class="stair" x="270" y="445" width="80" height="125"/>
  <text x="310" y="465" class="stair-ko">비상계단 A</text>
  <text x="310" y="481" class="stair-ko" font-size="9">(Stairs A)</text>
  <g class="exit-pulse">
    <use href="#exitSign" x="290" y="495" width="40" height="30"/>
  </g>

  <!-- 화물 E/V -->
  <rect class="cargo-ev" x="475" y="470" width="140" height="45"/>
  <text x="545" y="490" class="label-sm-ko">화물 E/V</text>

  <!-- Row 1 -->
  <rect class="core" x="360" y="520" width="55" height="50"/>
  <text x="387" y="550" class="ev-label">EV</text>
  <rect class="core" x="420" y="520" width="50" height="50"/>
  <text x="445" y="550" class="ev-label">EV</text>
  <rect class="recycle" x="475" y="520" width="95" height="50"/>
  <text x="522" y="540" class="label-sm-ko">분리수거</text>
  <rect class="room-util" x="575" y="520" width="40" height="50"/>
  <text x="595" y="540" class="red-tag" font-size="9">★ 택배</text>

  <!-- 가로 통로 -->
  <rect class="corridor-internal" x="270" y="595" width="345" height="35"/>
  <text x="278" y="617" font-size="9" fill="#666" text-anchor="start" font-weight="700">← 타사 출입문</text>
  <text x="442" y="615" class="corridor-en" font-size="10">통로</text>
  <text x="608" y="617" font-size="9" fill="#666" text-anchor="end" font-weight="700">SANDBOX 정문 →</text>

  <!-- Row 2 -->
  <rect class="core" x="360" y="640" width="55" height="50"/>
  <text x="387" y="670" class="ev-label">EV</text>
  <rect class="core" x="420" y="640" width="50" height="50"/>
  <text x="445" y="670" class="ev-label">EV</text>
  <rect class="core" x="475" y="640" width="140" height="50"/>
  <text x="545" y="670" class="ev-label">EV</text>

  <!-- SANDBOX 정문 -->
  <rect class="door" x="618" y="555" width="22" height="100" rx="2"/>
  <text x="629" y="608" font-size="9" fill="#8B4513" font-weight="700" text-anchor="middle" transform="rotate(-90 629 608)">SANDBOX 정문</text>

  <!-- 쪽문 -->
  <rect class="door" x="640" y="720" width="50" height="22" rx="2"/>
  <text x="665" y="735" font-size="9" fill="#8B4513" font-weight="700" text-anchor="middle">쪽문</text>

  <!-- 외부 공용통로 -->
  <rect class="corridor" x="80" y="745" width="1040" height="180"/>

  <rect class="room-util" x="240" y="755" width="380" height="60"/>
  <text x="430" y="785" class="label-sm-ko">소품실 (CS)</text>

  <text x="430" y="843" class="corridor-ko" font-size="16">공용 통로</text>
  <text x="430" y="860" class="corridor-en" font-size="12">(Common Corridor)</text>

  <rect class="room-util" x="800" y="755" width="180" height="55"/>
  <text x="890" y="785" class="label-sm-ko">여자화장실</text>

  <rect class="room-util" x="800" y="815" width="180" height="50"/>
  <text x="890" y="845" class="label-sm-ko">PS</text>

  <rect class="room-util" x="800" y="870" width="180" height="50"/>
  <text x="890" y="900" class="label-sm-ko">남자화장실</text>

  <rect class="cargo-ev" x="100" y="870" width="135" height="50"/>
  <text x="167" y="893" class="label-sm-ko">비상 E/V</text>

  <rect class="other-tenant" x="250" y="870" width="220" height="50"/>
  <text x="360" y="900" class="other-label" font-size="12">타사 창고</text>

  <!-- 비상계단 B -->
  <rect class="stair" x="490" y="870" width="285" height="50"/>
  <text x="632" y="893" class="stair-ko">비상계단 B (외부)</text>
  <text x="632" y="908" class="stair-ko" font-size="10">(Stairs B · External)</text>
  <g class="exit-pulse">
    <use href="#exitSign" x="505" y="880" width="36" height="27"/>
  </g>

  <!-- ============================================ -->
  <!--    동선: 모든 시작점 → 단일 분기점 (665,510) → A·B 갈라짐 -->
  <!-- ============================================ -->

  <!-- 좌측 시작점 3개 → 내부 통로 분기점 (442, 365) -->
  <path class="route-a" d="M 170 200 L 442 365"/>   <!-- Studio 2 우측아래 대각선 -->
  <path class="route-a" d="M 340 250 L 442 365"/>   <!-- 부조정실 → 내부 통로 -->
  <path class="route-a" d="M 170 480 L 442 365"/>   <!-- Studio 1 우측위 대각선 -->

  <!-- 내부 통로 분기점 → 메인 분기점 (665, 510) - ㄱ자 직선 (가로 → 세로) -->
  <path class="route-a" d="M 442 365 L 665 365 L 665 510"/>

  <!-- 우측 시작점 3개 → 메인 분기점 (각자 다른 경로로 겹침 X) -->
  <path class="route-a" d="M 575 230 L 665 230 L 665 510"/>      <!-- 위쪽 사무 좌석 → 분기점 (가로 → 세로) -->
  <path class="route-a" d="M 1012 240 L 1012 510 L 665 510"/>    <!-- 메일룸 → 분기점 (세로 → 가로, 사무 좌석 가운데 통과) -->

  <!-- A 루트 (초록): 분기점 → 정문 → 가로 통로 → 비상계단 A -->
  <path class="route-a" d="M 665 510 L 665 605 L 629 605 L 442 612 L 310 570"/>

  <!-- B 루트 (청록): 분기점 → 좌측 통로 아래 → 쪽문 → 외부 → 비상계단 B -->
  <path class="route-b" d="M 665 510 L 665 720 L 665 800 L 632 870"/>

  <!-- ============================================ -->
  <!--           시작점 6개                            -->
  <!-- ============================================ -->

  <g transform="translate(170,200)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <g transform="translate(340,250)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <g transform="translate(575,230)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <g transform="translate(1012,240)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <g transform="translate(170,480)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <g transform="translate(900,510)">
    <circle class="yah-ring" cx="0" cy="0" r="8" fill="none" stroke="#E60012" stroke-width="3"/>
    <circle class="yah-dot" cx="0" cy="0" r="7" fill="#E60012"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <!-- 소화전 픽토그램 -->
  <use href="#hydrant" x="380" y="332" width="26" height="26"/>
  <text x="393" y="372" font-size="9" fill="#BF1E2D" text-anchor="middle" font-weight="700">소화전</text>

  <use href="#hydrant" x="240" y="828" width="26" height="26"/>
  <text x="253" y="868" font-size="9" fill="#BF1E2D" text-anchor="middle" font-weight="700">소화전</text>

  <!-- 행동 요령 + 범례 -->
  <g transform="translate(40,950)">
    <rect width="1120" height="80" fill="#fff" stroke="#CCC" rx="4"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#222">화재 시 행동요령 · In Case of Fire</text>
    <text x="20" y="44" font-size="12" fill="#333">
      <tspan fill="#00964F" font-weight="700">━━ A 루트 (초록):</tspan> SANDBOX 정문 → EV ZONE → 비상계단 A · <tspan fill="#0288D1" font-weight="700">━━ B 루트 (청록):</tspan> 쪽문 → 외부 공용통로 → 비상계단 B
    </text>
    <text x="20" y="62" font-size="12" fill="#333">① 가까운 비상구 선택 · ② <tspan fill="#BF1E2D" font-weight="700">엘리베이터 사용 금지</tspan> · ③ 자세 낮추고 입·코 가림 · ④ 119 신고 + GA Slack #ga-helpdesk</text>
    <text x="20" y="76" font-size="11" fill="#666">붉은 점멸 점 = 시작점 (You are here)</text>
  </g>
</svg>
